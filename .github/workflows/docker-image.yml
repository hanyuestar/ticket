name: Docker Image

# 触发方式：
#   1) 推送版本标签（如 1.0.0 / v1.0.0）自动构建并推送镜像
#   2) 也可在 Actions 页面手动触发（workflow_dispatch）
on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

env:
  IMAGE_NAME: ticket

jobs:
  # ========== 1. GitHub Container Registry（ghcr.io/hanyuestar/ticket）==========
  ghcr:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (ghcr)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # pyppeteer 的 Chromium 仅提供 amd64 构建，暂不启用多架构
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========== 2. Docker Hub（kyson666/ticket）==========
  # 说明：Actions 的 job 级 if 不能直接引用 secrets，故通过 job env 注入，
  #       再由首步检测输出，后续步骤用步骤级 if 控制是否执行。
  dockerhub:
    name: Build & push to Docker Hub
    runs-on: ubuntu-latest
    needs: ghcr
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check credentials
        id: check
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 Docker Hub 凭据（secrets.DOCKERHUB_USERNAME / DOCKERHUB_TOKEN），跳过 Docker Hub 推送。仅推送 ghcr.io。"
          fi

      - name: Checkout
        if: steps.check.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Docker meta (Docker Hub)
        if: steps.check.outputs.available == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        if: steps.check.outputs.available == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
